<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <rect width="256" height="256" rx="0" fill="#0b1220"/>
  <rect x="16" y="16" width="224" height="224" rx="10" fill="none" stroke="#2fd4c4" stroke-width="2" opacity="0.35"/>
  
  <!-- Broken padlock shackle: two separated arc segments -->
  <path d="M 96 78 C 96 44 112 32 128 32 C 138 32 146 36 152 44 L 140 58 C 136 52 132 50 128 50 C 118 50 112 58 112 78 L 112 96 L 96 96 Z" fill="#e6f1ff" opacity="0.9"/>
  <path d="M 160 92 L 176 92 L 176 78 C 176 62 170 52 160 46 L 148 60 C 154 64 160 70 160 78 Z" fill="#e6f1ff" opacity="0.9"/>
  
  <!-- Padlock body (cracked, offset) -->
  <path d="M 88 108 L 168 104 L 172 188 L 92 192 Z" fill="#e6f1ff" opacity="0.92"/>
  <path d="M 126 106 L 132 140 L 120 146 L 128 186" fill="none" stroke="#0b1220" stroke-width="3"/>
  
  <!-- Keyhole -->
  <circle cx="130" cy="146" r="7" fill="#0b1220"/>
  <path d="M 127 150 L 126 168 L 134 168 L 133 150 Z" fill="#0b1220"/>
  
  <!-- Dolphin leaping through the broken gap, stylized, flat silhouette -->
  <g>
    <!-- dolphin body: head at upper right, tail lower left, leaping diagonally -->
    <path d="M 178 66 
             C 196 60 214 68 218 84 
             C 222 100 210 112 196 116 
             C 188 118 180 116 174 110 
             C 184 106 192 98 190 88 
             C 188 78 176 74 166 80 
             L 150 96 
             C 142 104 132 108 120 106 
             C 108 104 100 96 102 84 
             C 104 72 116 66 128 70 
             C 140 74 148 84 152 96 
             L 166 80 
             C 170 72 174 68 178 66 Z" 
          fill="#2fd4c4"/>
    <!-- dorsal fin -->
    <path d="M 168 78 C 162 64 156 56 148 52 C 152 64 154 72 156 82 Z" fill="#2fd4c4"/>
    <!-- pectoral fin -->
    <path d="M 146 92 C 138 96 130 100 124 98 C 130 92 138 88 146 88 Z" fill="#2fd4c4"/>
    <!-- tail fluke -->
    <path d="M 104 86 C 92 78 82 76 74 80 C 80 88 88 94 98 96 C 96 90 100 86 104 86 Z" fill="#2fd4c4"/>
    <!-- eye highlight -->
    <circle cx="200" cy="86" r="3" fill="#0b1220"/>
    <!-- belly shading -->
    <path d="M 186 104 C 176 108 166 108 158 102 C 168 104 178 102 186 104 Z" fill="#e6f1ff" opacity="0.5"/>
  </g>
  
  <!-- Accent sparks / energy dots near break point -->
  <circle cx="190" cy="118" r="3" fill="#ff8a3d"/>
  <circle cx="176" cy="128" r="2" fill="#ff8a3d"/>
  <circle cx="200" cy="130" r="2.5" fill="#ff8a3d"/>
  <circle cx="82" cy="72" r="2" fill="#2fd4c4" opacity="0.7"/>
  
  <!-- Small wordmark -->
  <text x="128" y="222" font-family="monospace" font-size="11" fill="#e6f1ff" text-anchor="middle" letter-spacing="2" opacity="0.55">DOLPHIN ANTY</text>
</svg>
